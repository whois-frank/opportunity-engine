services:
  - type: web
    name: opportunity-engine
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn run:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: opportunity-engine-db
          property: connectionString

  # Runs the scraper/update agent on a schedule. Free tier supports cron jobs
  # with limited monthly runtime - check current Render limits.
  - type: cron
    name: opportunity-engine-updater
    env: python
    schedule: "0 */6 * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m app.scrapers.update_agent"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: opportunity-engine-db
          property: connectionString

databases:
  - name: opportunity-engine-db
    plan: free
