<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Scoutly — Latest Jobs & Scholarships{% endblock %}</title>
    <meta name="description" content="{% block description %}Fresh remote jobs and scholarships, updated automatically, no fluff.{% endblock %}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Monetag: In-Page Push (Banner) -->
    <script>(function(s){s.dataset.zone='11486454',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>

    <!-- Monetag: Push Notifications -->
    <script src="https://5gvci.com/act/files/tag.min.js?z=11486461" data-cfasync="false" async></script>

    <!-- AdSense: replace ca-pub-XXXXXXXXXXXXXXXX with your real publisher ID once approved -->
    <!-- <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script> -->

    <!-- Google Analytics: replace G-XXXXXXXXXX with your real GA4 Measurement ID -->
    <!--
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX');
    </script>
    -->
</head>
<body>
    <header class="site-header">
        <a href="{{ url_for('main.home') }}" class="logo">Scoutly</a>
        <nav>
            <a href="{{ url_for('main.jobs') }}">Jobs</a>
            <a href="{{ url_for('main.scholarships') }}">Scholarships</a>
        </nav>
    </header>

    <!-- Top ad slot: small, unobtrusive -->
    <div class="ad-slot ad-slot-top">
        <!-- <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="TOP_SLOT_ID" data-ad-format="auto"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script> -->
    </div>

    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Bottom ad slot -->
    <div class="ad-slot ad-slot-bottom">
        <!-- <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="BOTTOM_SLOT_ID" data-ad-format="auto"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script> -->
    </div>

    <footer>
        <p>&copy; {{ 2026 }} Scoutly. Listings sourced from public job boards and RSS feeds.</p>
    </footer>
</body>
</html>
